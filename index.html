<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Rosa 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose: #c0435a;
    --rose-light: #e8809a;
    --rose-dark: #7a1f32;
    --cream: #fdf6f0;
    --warm: #f5e6d8;
    --gold: #c9975a;
    --text: #3a1a22;
  }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
  }

  /* ─── FLOATING PETALS ─── */
  .petals-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -40px;
    font-size: 1.4rem;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg) translateX(60px); opacity: 0; }
  }

  /* ─── SCREENS ─── */
  .screen {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 2rem;
    text-align: center;
  }
  .screen.active { display: flex; }

  /* ─── INTRO ─── */
  #intro {
    background: linear-gradient(160deg, #fdf0f5 0%, #fde8ef 60%, #f5d6e2 100%);
  }
  .intro-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: var(--rose-dark);
    line-height: 1.1;
    margin-bottom: 1rem;
    animation: fadeUp 1s ease both;
  }
  .intro-subtitle {
    font-size: 1.1rem;
    color: var(--rose);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    font-weight: 300;
    animation: fadeUp 1s 0.3s ease both;
  }
  .big-heart {
    font-size: 5rem;
    animation: heartbeat 1.5s ease-in-out infinite, fadeUp 1s 0.5s ease both;
    display: block;
    margin-bottom: 2rem;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* ─── BUTTON ─── */
  .btn {
    display: inline-block;
    padding: 0.9rem 2.5rem;
    border: none;
    border-radius: 50px;
    font-family: 'Lato', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    font-weight: 400;
  }
  .btn-primary {
    background: var(--rose);
    color: white;
    box-shadow: 0 6px 24px rgba(192,67,90,0.35);
    animation: fadeUp 1s 0.7s ease both;
  }
  .btn-primary:hover {
    background: var(--rose-dark);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(192,67,90,0.45);
  }
  .btn-secondary {
    background: transparent;
    color: var(--rose);
    border: 2px solid var(--rose-light);
    margin-top: 1rem;
  }
  .btn-secondary:hover {
    background: var(--rose-light);
    color: white;
    transform: translateY(-2px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── QUIZ / GAME ─── */
  #game {
    background: linear-gradient(160deg, #fff5f7 0%, var(--cream) 100%);
    padding-top: 4rem;
  }
  .progress-bar-wrap {
    width: min(500px, 90vw);
    height: 6px;
    background: #f0d5db;
    border-radius: 10px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--rose-light), var(--rose));
    border-radius: 10px;
    transition: width 0.6s ease;
  }
  .question-number {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rose-light);
    margin-bottom: 0.5rem;
  }
  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    color: var(--rose-dark);
    max-width: 600px;
    margin: 0 auto 2rem;
    line-height: 1.4;
    min-height: 80px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    width: min(500px, 90vw);
  }
  .option-btn {
    background: white;
    border: 2px solid #f0d5db;
    border-radius: 14px;
    padding: 1rem 1.5rem;
    font-family: 'Lato', sans-serif;
    font-size: 1rem;
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .option-btn:hover {
    border-color: var(--rose-light);
    background: #fff0f4;
    transform: translateX(6px);
  }
  .option-btn.correct {
    border-color: #4caf7d;
    background: #edf7f2;
    color: #2d7a50;
    animation: pulse-green 0.4s ease;
  }
  .option-btn.wrong {
    border-color: #e07070;
    background: #fef0f0;
    color: #a04040;
    animation: shake 0.4s ease;
  }
  .option-btn.reveal-correct {
    border-color: #4caf7d;
    background: #edf7f2;
  }
  .option-letter {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #f0d5db;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--rose);
    flex-shrink: 0;
    transition: all 0.25s;
  }
  .option-btn:hover .option-letter,
  .option-btn.correct .option-letter { background: var(--rose); color: white; }
  .option-btn.wrong .option-letter { background: #e07070; color: white; }

  @keyframes pulse-green {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .feedback-msg {
    margin-top: 1.2rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--rose);
    font-size: 1.05rem;
    min-height: 1.5em;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .feedback-msg.show { opacity: 1; }

  .score-badge {
    position: fixed;
    top: 1.2rem; right: 1.5rem;
    background: var(--rose);
    color: white;
    border-radius: 50px;
    padding: 0.4rem 1rem;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    z-index: 10;
    display: none;
  }

  /* ─── RESULT ─── */
  #result {
    background: linear-gradient(160deg, #fdf0f5 0%, #fde8ef 60%, #f5d6e2 100%);
  }
  .result-emoji { font-size: 4rem; margin-bottom: 1rem; animation: bounceIn 0.7s ease both; }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 6vw, 3rem);
    color: var(--rose-dark);
    margin-bottom: 0.5rem;
  }
  .result-score {
    font-size: 1.2rem;
    color: var(--rose);
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }
  .result-msg {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--rose-dark);
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.5s ease both, fadeOpacity 0.8s 0.5s ease both;
  }
  @keyframes fadeOpacity { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ─── LOVE LETTER ─── */
  #letter {
    background: linear-gradient(160deg, #fff8f0 0%, var(--cream) 100%);
    padding-top: 4rem;
  }
  .letter-card {
    background: white;
    border-radius: 20px;
    padding: 2.5rem;
    max-width: 560px;
    width: 90vw;
    box-shadow: 0 20px 60px rgba(192,67,90,0.12);
    border: 1px solid #f5dde4;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s ease both;
  }
  .letter-card::before {
    content: '❝';
    position: absolute;
    top: -10px; left: 20px;
    font-size: 8rem;
    color: #f5dde4;
    font-family: 'Playfair Display', serif;
    line-height: 1;
    z-index: 0;
  }
  .letter-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.8;
    color: var(--text);
    position: relative;
    z-index: 1;
  }
  .letter-sign {
    margin-top: 1.5rem;
    font-family: 'Playfair Display', serif;
    color: var(--rose);
    font-size: 1.1rem;
    text-align: right;
  }
  .letter-nav {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ─── DECORATIVE ─── */
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--rose-light), transparent);
    margin: 1.5rem auto;
  }
  .rose-deco {
    font-size: 1.5rem;
    opacity: 0.3;
    position: absolute;
  }
</style>
</head>
<body>

<!-- Petals -->
<div class="petals-container" id="petals"></div>

<!-- Score badge -->
<div class="score-badge" id="scoreBadge">❤️ 0</div>

<!-- ══════════ INTRO ══════════ -->
<div class="screen active" id="intro">
  <span class="big-heart">🌹</span>
  <p class="intro-subtitle">Un mensaje especial</p>
  <h1 class="intro-title">Hola,<br><em>Rosa</em></h1>
  <div class="divider"></div>
  <p style="color:var(--rose); margin-bottom:2rem; font-size:1.05rem; max-width:380px; animation: fadeUp 1s 0.6s ease both; opacity:0; animation-fill-mode:both;">
    Te preparé una pequeña experiencia.<br>¿Cuánto sabes sobre nuestra historia?
  </p>
  <button class="btn btn-primary" onclick="startGame()">Comenzar ✨</button>
</div>

<!-- ══════════ GAME ══════════ -->
<div class="screen" id="game">
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <p class="question-number" id="questionNumber">Pregunta 1 de 6</p>
  <p class="question-text" id="questionText"></p>
  <div class="options" id="optionsContainer"></div>
  <p class="feedback-msg" id="feedbackMsg"></p>
</div>

<!-- ══════════ RESULT ══════════ -->
<div class="screen" id="result">
  <div class="result-emoji" id="resultEmoji">🎉</div>
  <h2 class="result-title" id="resultTitle">¡Increíble!</h2>
  <p class="result-score" id="resultScore"></p>
  <p class="result-msg" id="resultMsg"></p>
  <div style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;">
    <button class="btn btn-primary" onclick="goToLetter()">Ver tu carta 💌</button>
    <button class="btn btn-secondary" onclick="restart()">Intentar de nuevo</button>
  </div>
</div>

<!-- ══════════ LETTER ══════════ -->
<div class="screen" id="letter">
  <p class="intro-subtitle" style="animation:fadeUp 0.6s ease both;">Para ti, con todo mi amor</p>
  <div class="letter-card" id="letterCard">
    <p class="letter-text" id="letterText"></p>
    <p class="letter-sign">Con amor, Cristian 🌹</p>
  </div>
  <div class="letter-nav">
    <button class="btn btn-secondary" id="prevLetterBtn" onclick="changeMessage(-1)" style="display:none">← Anterior</button>
    <button class="btn btn-primary" id="nextLetterBtn" onclick="changeMessage(1)">Siguiente 💌</button>
  </div>
  <p id="letterCounter" style="margin-top:1rem; color:var(--rose-light); font-size:0.85rem; letter-spacing:0.1em;"></p>
</div>

<script>
// ─── PETALS ───
(function() {
  const container = document.getElementById('petals');
  const emojis = ['🌸','🌹','💕','✨','🌺','💖'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
})();

// ─── QUESTIONS ───
const questions = [
  {
    q: "¿Cuál fue la primera canción que te dediqué?",
    options: ["Eres — Café Tacvba", "Te quiero — Café Tacvba", "Amores como el nuestro — Jerry Rivera", "La Bikina — Rubén Fuentes"],
    correct: 0,
    feedback: "\"Eres\" de Café Tacvba... porque esa canción te describe a ti 🎶💕"
  },
  {
    q: "¿Quién escribe mensajes más largos?",
    options: ["Cristian", "Rosa", "Los dos igual", "Depende del día"],
    correct: 1,
    feedback: "Tú siempre tienes más que decir... y me encanta 💕"
  },
  {
    q: "¿Cuántas veces escribí la palabra \"amor\" para ti?",
    options: ["Menos de 1,000", "Alrededor de 2,000", "Más de 3,500", "Nunca las conté"],
    correct: 2,
    feedback: "¡Más de 3,735 veces! Y cada una fue de verdad 💖"
  },
  {
    q: "¿Cuál fue el día más especial de nuestra historia según los mensajes?",
    options: ["Navidad 2020", "14 de febrero 2026", "Año nuevo 2024", "Nuestro aniversario"],
    correct: 1,
    feedback: "San Valentín 2026... ¡2,561 mensajes en un día! 🌹"
  },
  {
    q: "¿A qué hora solemos hablar más?",
    options: ["A mediodía", "Por la tarde", "De madrugada", "Por la mañana temprano"],
    correct: 2,
    feedback: "De madrugada, cuando el mundo duerme y nosotros no 🌙"
  },
  {
    q: "¿Cuántos mensajes hemos mandado en total?",
    options: ["Menos de 10,000", "Alrededor de 30,000", "Más de 63,000", "Infinitos"],
    correct: 2,
    feedback: "¡63,193 mensajes! Una conversación que nunca termina ✨"
  }
];

let current = 0;
let score = 0;
let answered = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  current = 0; score = 0;
  document.getElementById('scoreBadge').style.display = 'block';
  updateScoreBadge();
  showScreen('game');
  renderQuestion();
}

function updateScoreBadge() {
  document.getElementById('scoreBadge').textContent = '❤️ ' + score;
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;
  document.getElementById('progressBar').style.width = (current / total * 100) + '%';
  document.getElementById('questionNumber').textContent = `Pregunta ${current + 1} de ${total}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedbackMsg').classList.remove('show');
  document.getElementById('feedbackMsg').textContent = '';

  const letters = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span> ${opt}`;
    btn.onclick = () => selectOption(i, btn);
    container.appendChild(btn);
  });
}

function selectOption(index, btn) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const allBtns = document.querySelectorAll('.option-btn');
  const feedback = document.getElementById('feedbackMsg');

  allBtns.forEach(b => b.style.pointerEvents = 'none');

  if (index === q.correct) {
    btn.classList.add('correct');
    score++;
    updateScoreBadge();
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('reveal-correct');
  }

  feedback.textContent = q.feedback;
  feedback.classList.add('show');

  setTimeout(() => {
    current++;
    if (current < questions.length) renderQuestion();
    else showResult();
  }, 2000);
}

function showResult() {
  document.getElementById('scoreBadge').style.display = 'none';
  const total = questions.length;
  const pct = score / total;
  let emoji, title, msg;

  if (pct === 1) {
    emoji = '🌹'; title = '¡Perfecta!';
    msg = 'Lo sabías todo... porque viviste cada momento conmigo. Eres mi historia favorita.';
  } else if (pct >= 0.66) {
    emoji = '💖'; title = '¡Qué bonito!';
    msg = 'Llevas nuestra historia en el corazón. Algunos detalles se escapan, pero lo importante nunca.';
  } else if (pct >= 0.33) {
    emoji = '🌸'; title = 'Casi, casi...';
    msg = 'No importan las respuestas correctas. Lo que importa es que seguimos escribiendo esta historia juntos.';
  } else {
    emoji = '💕'; title = 'Hay mucho por descubrir';
    msg = 'Quizás no recuerdas los números, pero sí recuerdas lo que sientes. Y eso vale más que todo.';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = `${score} de ${total} respuestas correctas`;
  document.getElementById('resultMsg').textContent = msg;
  showScreen('result');
}

function restart() { startGame(); }

// ─── LOVE LETTERS ───
const letters = [
  "Desde que te escribí ese primer mensaje, algo en mí supo que tú eras especial. No sabía cómo ni cuándo, pero lo sabía.",
  "Hay noches en que el mundo está en silencio y yo sigo aquí, escribiéndote, porque hablar contigo es lo mejor que me puede pasar en el día.",
  "Más de 63,000 mensajes y todavía tengo cosas que decirte. Creo que nunca me voy a quedar sin palabras cuando se trata de ti.",
  "Te escribí \"amor\" más de tres mil veces, y cada vez lo sentí de verdad. No es un hábito, es que tú lo inspiras sin esfuerzo.",
  "Gracias por seguir aquí, después de todo. Por los altos y los bajos, por los silencios y los regresos. Eres la persona con quien quiero seguir contando los días.",
  "Esta página la hice para ti, como un pequeño recordatorio: te quiero, Rosa. Hoy, mañana y en cada madrugada que nos quede por vivir. 🌹"
];

let letterIndex = 0;

function goToLetter() {
  letterIndex = 0;
  renderLetter();
  showScreen('letter');
}

function renderLetter() {
  const card = document.getElementById('letterCard');
  card.style.opacity = '0';
  card.style.transform = 'translateY(20px)';
  setTimeout(() => {
    document.getElementById('letterText').textContent = letters[letterIndex];
    document.getElementById('letterCounter').textContent = `${letterIndex + 1} de ${letters.length}`;
    document.getElementById('prevLetterBtn').style.display = letterIndex > 0 ? 'inline-block' : 'none';
    const nextBtn = document.getElementById('nextLetterBtn');
    nextBtn.textContent = letterIndex < letters.length - 1 ? 'Siguiente 💌' : 'Volver al inicio 🌹';
    card.style.transition = 'all 0.5s ease';
    card.style.opacity = '1';
    card.style.transform = 'translateY(0)';
  }, 200);
}

function changeMessage(dir) {
  letterIndex += dir;
  if (letterIndex >= letters.length) { letterIndex = 0; showScreen('intro'); return; }
  if (letterIndex < 0) letterIndex = 0;
  renderLetter();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En Mantenimiento</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red-light: #fce4e4;
      --red-mid: #e24b4a;
      --red-dark: #a32d2d;
      --red-crack: #f7c1c1;
      --bg: #0d0d0d;
      --text: #f5f0eb;
      --muted: #888;
      --accent: #e24b4a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Grain texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10;
      opacity: 0.5;
    }

    /* Glow de fondo */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(226,75,74,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 2rem;
      animation: fadeIn 1s ease forwards;
    }

    /* ── Corazón SVG ── */
    .heart-wrap {
      display: inline-block;
      margin-bottom: 2.5rem;
      animation: heartbeat 3s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      10%       { transform: scale(1.04); }
      20%       { transform: scale(1); }
      30%       { transform: scale(1.02); }
      40%       { transform: scale(1); }
    }

    .heart-svg { display: block; }

    /* Partículas flotantes */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red-mid);
      opacity: 0;
      animation: float var(--dur) ease-in infinite var(--delay);
    }

    @keyframes float {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-80vh) scale(0.3); }
    }

    /* Badge */
    .badge {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red-mid);
      border: 1px solid rgba(226,75,74,0.35);
      padding: 5px 16px;
      border-radius: 100px;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    /* Título */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    h1 span {
      color: var(--accent);
      font-style: italic;
    }

    /* Subtítulo */
    p {
      font-size: 15px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 380px;
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.6s forwards;
    }

    /* Barra de progreso */
    .progress-wrap {
      width: 280px;
      margin: 0 auto 2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.8s forwards;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      animation: fill 2.5s ease 1.2s forwards;
    }

    @keyframes fill {
      to { width: 68%; }
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Reproductor de música */
    .music-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(226,75,74,0.4);
      background: rgba(13,13,13,0.85);
      color: var(--red-mid);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      z-index: 50;
      opacity: 0;
      animation: fadeIn 1s ease 1.8s forwards;
      backdrop-filter: blur(6px);
    }
    .music-btn:hover {
      background: rgba(226,75,74,0.12);
      border-color: rgba(226,75,74,0.7);
      transform: scale(1.08);
    }
    .music-btn.playing {
      animation: fadeIn 1s ease 1.8s forwards, pulse-ring 2s ease-in-out infinite 1.8s;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(226,75,74,0.3); }
      50%       { box-shadow: 0 0 0 8px rgba(226,75,74,0); }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <!-- Partículas -->
  <div class="particles" id="particles"></div>

  <div class="container">

    <div class="badge">En mantenimiento</div>

    <!-- Corazón SVG roto -->
    <div class="heart-wrap">
      <svg class="heart-svg" width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Mitad izquierda -->
        <path d="M70 125
          C70 125 18 88 10 55
          C4 30 18 10 38 10
          C52 10 64 20 70 32
          L63 55 L76 55 L60 105 Z"
          fill="#e24b4a" stroke="#a32d2d" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Mitad derecha -->
        <path d="M70 125
          C70 125 122 88 130 55
          C136 30 122 10 102 10
          C88 10 76 20 70 32
          L77 55 L64 55 L80 105 Z"
          fill="#e24b4a" stroke="#a32d2d" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Grieta zigzag -->
        <polyline points="70,30 63,55 76,55 60,108"
          fill="none" stroke="#fce4e4" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Separación central -->
        <line x1="70" y1="28" x2="70" y2="128"
          stroke="#0d0d0d" stroke-width="3"/>
      </svg>
    </div>

    <h1>Algo se <span>rompió</span><br>por dentro.</h1>

    <p>Estamos reparando el sitio con todo el cuidado del mundo.<br>Regresamos muy pronto.</p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Reparando</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="fill"></div>
      </div>
    </div>

  </div>

  <footer>© 2026 — Volvemos pronto 🛠</footer>

  <!-- Audio -->
  <audio id="bgMusic" src="musica.mp3" loop></audio>

  <!-- Botón música -->
  <button class="music-btn" id="musicBtn" title="Reproducir música">♪</button>

  <script>
    // Partículas
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${80 + Math.random() * 20}%;
        --dur: ${4 + Math.random() * 6}s;
        --delay: ${Math.random() * 8}s;
        width: ${2 + Math.random() * 4}px;
        height: ${2 + Math.random() * 4}px;
        opacity: 0;
      `;
      container.appendChild(p);
    }

    // Contador de porcentaje
    const pct = document.getElementById('pct');
    let val = 0;
    const target = 68;
    const interval = setInterval(() => {
      if (val >= target) { clearInterval(interval); return; }
      val++;
      pct.textContent = val + '%';
    }, 2500 / target);

    // Música
    const audio = document.getElementById('bgMusic');
    const btn   = document.getElementById('musicBtn');
    audio.volume = 0.5;

    btn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btn.textContent = '♬';
        btn.classList.add('playing');
        btn.title = 'Pausar música';
      } else {
        audio.pause();
        btn.textContent = '♪';
        btn.classList.remove('playing');
        btn.title = 'Reproducir música';
      }
    });
  </script>

</body>
</html>

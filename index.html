<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500&display=swap">
<style>
:root{
  --bg:#180f13; --surface:#281a20; --text:#f6ece8; --muted:#c0aaa7; --accent:#e5a0aa; --line:#503740;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Karla',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: light){
  :root{--bg:#f7efeb;--surface:#fffaf7;--text:#302126;--muted:#806c69;--accent:#ae5365;--line:#e8d7d1;}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 12%,var(--bg)),var(--bg) 60%);color:var(--text);font-family:var(--sans);line-height:1.6}
[hidden]{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:400px;padding:clamp(28px,7vw,44px);border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 24px 70px #0002}
.box h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1.05;margin:0 0 .4rem}
.box p{color:var(--muted);margin:0 0 2rem}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.3rem}
input[type=text],input[type=password]{width:100%;padding:.8rem 1rem;margin-bottom:1.1rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:.85rem 1.4rem;border:0;border-radius:10px;background:var(--accent);color:#1c1014;font:inherit;font-weight:500;cursor:pointer;transition:transform .2s ease,filter .2s ease}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
#err{color:var(--accent);min-height:1.5em;margin:.9rem 0 0;font-size:.95rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Línea del tiempo */
#content{max-width:700px;margin:0 auto;padding:10vh 24px 180px}
#content h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,11vw,5rem);line-height:1;margin:0 0 1rem}
.lead{font-family:var(--serif);font-style:italic;font-size:1.4rem;color:var(--muted);margin:0 0 3rem}
#tl{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
#tl::before{content:"";position:absolute;left:6px;top:6px;bottom:0;width:2px;background:var(--line)}
.ev{position:relative;margin:0 0 1.4rem;padding:1.25rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 12px 32px #0000000d;opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease;visibility:hidden}
.ev.on{opacity:1;transform:none;visibility:visible}
.ev::before{content:"";position:absolute;left:-34px;top:1.7rem;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--bg)}
.ev h2{font-family:var(--serif);font-weight:600;font-size:1.7rem;line-height:1.2;margin:0 0 .5rem}
.ev p{max-width:60ch;margin:0 0 1rem;font-size:1.05rem}
.ev img{display:block;width:100%;max-height:70vh;object-fit:cover;border-radius:10px}
#fin{font-family:var(--serif);font-style:italic;font-size:1.5rem;margin:1.5rem 0 0;opacity:0;transition:opacity 1.2s}
#fin.on{opacity:1}
#nosong{color:var(--accent);font-size:.95rem;margin:-2.5rem 0 3rem}

/* Reproductor */
#player{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -12px 34px #0002}
#pp{min-width:112px}
#bar{flex:1;accent-color:var(--accent)}
#time{font-size:.9rem;color:var(--muted);min-width:44px;text-align:right}
#logout{margin-top:3rem;background:transparent;color:var(--muted);border:1px solid var(--line)}
#goodbye{position:fixed;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:1rem;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);text-align:center}
#goodbye[hidden]{display:none}
#goodbye .burst{position:relative;display:grid;place-items:center;width:150px;height:150px}
#goodbye .heart{color:var(--accent);font-size:7rem;line-height:1;text-shadow:0 0 35px color-mix(in srgb,var(--accent) 55%,transparent);animation:heart-burst 2.2s ease-out both}
#goodbye .shard{position:absolute;color:var(--accent);font-size:1.5rem;opacity:0;animation:heart-shard 1.4s ease-out both}
#goodbye .shard:nth-child(2){--x:-76px;--y:-54px}
#goodbye .shard:nth-child(3){--x:-30px;--y:-92px;animation-delay:.08s}
#goodbye .shard:nth-child(4){--x:35px;--y:-82px;animation-delay:.14s}
#goodbye .shard:nth-child(5){--x:82px;--y:-34px;animation-delay:.04s}
#goodbye .shard:nth-child(6){--x:74px;--y:42px;animation-delay:.1s}
#goodbye .shard:nth-child(7){--x:16px;--y:84px;animation-delay:.18s}
#goodbye .shard:nth-child(8){--x:-55px;--y:70px;animation-delay:.06s}
#goodbye .shard:nth-child(9){--x:-88px;--y:10px;animation-delay:.12s}
#goodbye p{margin:0;color:var(--text);font-family:var(--serif);font-size:clamp(2rem,8vw,3rem);font-style:italic;animation:message-in .6s .45s both}
@keyframes heart-burst{0%,25%{transform:scale(.45)}45%{transform:scale(1.18)}65%{transform:scale(1)}100%{transform:scale(.18);opacity:0}}
@keyframes heart-shard{0%,28%{transform:translate(0,0) scale(.2);opacity:0}45%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
@keyframes message-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:480px){#content{padding-top:8vh}.ev{padding:1rem}#player{gap:10px;padding-right:14px;padding-left:14px}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.ev,button{transition:none}#goodbye *{animation:none!important}#goodbye .heart{opacity:0}#goodbye .shard{opacity:0}}
</style>
</head>
<body>

<main id="login">
  <div class="box" id="box">
    <h1>Para ti</h1>
    <p>Un pequeño viaje por nuestros recuerdos.</p>
    <label for="u">Usuario</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="p">Clave</label>
    <input id="p" type="password" autocomplete="current-password">
    <button id="go" type="button">Entrar</button>
    <p id="err" role="alert"></p>
  </div>
</main>

<main id="content" hidden>
  <h1>Para ti</h1>
  <p class="lead">Una canción. Nuestros recuerdos.</p>
  <p id="nosong" hidden>No encontré la canción (musica.mp3). Mostrando todo sin música.</p>
  <ol id="tl"></ol>
  <button id="logout" type="button">Salir</button>
</main>

<div id="player" hidden>
  <button id="pp" type="button">Reproducir</button>
  <input id="bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Avance de la canción">
  <span id="time">0:00</span>
</div>
<div id="goodbye" hidden role="status" aria-live="polite">
  <div class="burst" aria-hidden="true">
    <span class="heart">♥</span>
    <span class="shard">♥</span><span class="shard">♥</span><span class="shard">♥</span>
    <span class="shard">♥</span><span class="shard">♥</span><span class="shard">♥</span>
    <span class="shard">♥</span><span class="shard">♥</span>
  </div>
  <p>Nunca te olvidaré</p>
</div>
<audio id="aud" preload="auto"></audio>

<script>
/* ================= CONFIGURACIÓN ================= */
// SHA-256 de "usuario:clave" (usuario en minúsculas)
const HASH = "8454eb8621fa12c0b10c0a925de7151dab1c1976eb8b2c55067e17ac89fd4d15";

// Canción junto a este HTML
const SONG = "musica.mp3";

// Cada momento aparece cuando la canción llega al segundo "at".
const TIMELINE = [
  { at: 0,      title: "El comienzo", text: "Quién diría que un juego nos llevaría hasta aquí.", photo: "foto1.jpg" },
  { at: 20.72,  title: "Por fin", text: "Ese día tan esperado: por fin nos vimos.", photo: "foto2.jpg" },
  { at: 41.44,  title: "Nosotros", text: "Cuánto extraño esos días a tu lado.", photo: "foto3.jpg" },
  { at: 62.16,  title: "Felices", text: "Qué bonito era vernos así.", photo: "foto4.jpg" },
  { at: 82.88,  title: "Te extraño", text: "Ojalá pudiera arreglarlo. Te extraño mucho.", photo: "img1.jpg" },
  { at: 103.6,   title: "Lo mejor", text: "Fuiste lo mejor. Deseo que seas muy feliz.", photo: "img2.jpg" },
  { at: 124.33, title: "Perdóname", text: "Lamento mis errores. Daría mucho por volver atrás.", photo: "img3.jpg" },
  { at: 145.05, title: "Quería que supieras", text: "Solo quiero aclarar que lo de esos audios no pasó.", photo: "img4.jpg" },
  { at: 165.77, title: "Siempre", text: "Si algún día quieres hablar, aquí estaré. Siempre serás alguien muy especial para mí.", photo: "img5.jpg" }
];

const FINAL = "Gracias por todo.";
/* ================================================= */

const $ = id => document.getElementById(id);
const aud = $("aud");
const tl = $("tl");
let songOK = true;

async function sha256(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

// Construir la línea del tiempo
const evs = TIMELINE.map(m => {
  const li = document.createElement("li");
  li.className = "ev";
  const h = document.createElement("h2"); h.textContent = m.title; li.appendChild(h);
  const p = document.createElement("p"); p.textContent = m.text; li.appendChild(p);
  if (m.photo){
    const img = document.createElement("img");
    img.src = m.photo; img.alt = m.title; img.loading = "eager";
    img.onerror = () => img.remove();
    li.appendChild(img);
  }
  tl.appendChild(li);
  return { el: li, at: m.at };
});
const fin = document.createElement("li");
fin.id = "fin"; fin.textContent = FINAL; tl.appendChild(fin);

function fmt(t){ t = Math.floor(t||0); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); }

function sync(scroll){
  const t = aud.currentTime;
  let last = null;
  evs.forEach(e => {
    const should = t >= e.at;
    if (should && !e.el.classList.contains("on")){ e.el.classList.add("on"); last = e.el; }
    if (!should) e.el.classList.remove("on");
  });
  if (last && scroll) last.scrollIntoView({ behavior: "smooth", block: "center" });
  if (aud.duration){ $("bar").value = (t / aud.duration) * 100; }
  $("time").textContent = fmt(t);
}

aud.addEventListener("timeupdate", () => sync(true));
aud.addEventListener("seeked", () => sync(false));
aud.addEventListener("play", () => $("pp").textContent = "Pausar");
aud.addEventListener("pause", () => $("pp").textContent = "Reproducir");
aud.addEventListener("ended", () => { fin.classList.add("on"); fin.scrollIntoView({ behavior: "smooth", block: "center" }); });
aud.addEventListener("error", () => {
  songOK = false;
  $("nosong").hidden = false; $("player").hidden = true;
  evs.forEach(e => e.el.classList.add("on")); fin.classList.add("on");
});

$("pp").addEventListener("click", () => { aud.paused ? aud.play().catch(()=>{}) : aud.pause(); });
$("bar").addEventListener("input", e => { if (aud.duration) aud.currentTime = (e.target.value / 100) * aud.duration; });

async function enter(){
  const h = await sha256($("u").value.trim().toLowerCase() + ":" + $("p").value);
  if (h === HASH){
    $("err").textContent = "";
    $("login").hidden = true; $("content").hidden = false; $("player").hidden = false;
    window.scrollTo(0,0);
    aud.src = SONG;
    aud.play().catch(()=>{});   // arranca con el clic de "Entrar"
  } else {
    $("err").textContent = "Usuario o clave incorrectos. Inténtalo de nuevo.";
    $("box").classList.remove("shake"); void $("box").offsetWidth; $("box").classList.add("shake");
    $("p").value = ""; $("p").focus();
  }
}
$("go").addEventListener("click", enter);
document.addEventListener("keydown", e => { if (e.key === "Enter" && !$("login").hidden) enter(); });
$("logout").addEventListener("click", () => {
  aud.pause(); aud.removeAttribute("src"); aud.load();
  evs.forEach(e => e.el.classList.remove("on")); fin.classList.remove("on");
  $("u").value = ""; $("p").value = "";
  $("content").hidden = true; $("player").hidden = true;
  $("goodbye").hidden = false;
  setTimeout(() => {
    $("goodbye").hidden = true;
    $("login").hidden = false;
  }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1200 : 2200);
});
</script>
</body>
</html>
